name: Guardrail Push Alerts
on:
  push:
    branches: [main]

jobs:
  slack-alert:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Process and Format Slack Alert
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Safely map variables as structured environment inputs
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          PUSH_SHA: ${{ github.event.after }}
          FORCED_PUSH: ${{ github.event.forced }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          # Rebase merges can name the merging user as committer. Check the PR record instead.
          # Only suppress alerts for PR merges associated with this branch update.
          if [ "$FORCED_PUSH" != "true" ]; then
            PR_PAGES=$(gh api --paginate --slurp "repos/${REPO_NAME}/commits/${PUSH_SHA}/pulls")
            IS_PR_MERGE=$(jq -r \
              --arg sha "$PUSH_SHA" \
              --arg repo "$REPO_NAME" \
              --arg run_started_at "$RUN_STARTED_AT" '
              any(.[][];
                .merged_at != null and .merge_commit_sha == $sha and
                .base.ref == "main" and .base.repo.full_name == $repo and
                (
                  (
                    (.merged_at | fromdateiso8601) -
                    ($run_started_at | fromdateiso8601)
                  ) as $delta |
                  $delta >= -900 and $delta <= 900
                )
              )
            ' <<< "$PR_PAGES")

            if [ "$IS_PR_MERGE" = "true" ]; then
              echo "Push matches a merged PR into main; no alert needed."
              exit 0
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg msg "$COMMIT_MSG" \
            --arg repo "$REPO_NAME" \
            --arg actor "$ACTOR" \
            '{text: "⚠️ *Direct Push to Main Detected!*\n*Repo:* `\($repo)`\n*Actor:* `@\($actor)`\n*Commit:* `\($msg)`"}')

          curl --fail-with-body --silent --show-error -X POST \
            -H 'Content-type: application/json' --data "$PAYLOAD" \
            "${SLACK_URL:?SLACK_WEBHOOK_URL is not configured}"
